name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege for GITHUB_TOKEN. The repository default is already
# read-only; declaring it here keeps this workflow minimal even if that
# default changes (CodeQL actions/missing-workflow-permissions). This
# workflow only checks out and runs the test suite.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
