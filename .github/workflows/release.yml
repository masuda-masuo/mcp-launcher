name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: mcp-launcher-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: mcp-launcher-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: mcp-launcher-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: mcp-launcher-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: mcp-launcher-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Windows version info
        if: matrix.goos == 'windows'
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          goversioninfo \
            -product-name="MCP Launcher" \
            -description="Secure MCP server launcher with token rotation" \
            -company="masuda-masuo" \
            -copyright="MIT License" \
            -ver-major="$MAJ" \
            -ver-minor="$MIN" \
            -ver-patch="$PATCH" \
            -product-ver-major="$MAJ" \
            -product-ver-minor="$MIN" \
            -product-ver-patch="$PATCH" \
            -file-version="${{ github.ref_name }}" \
            -product-version="${{ github.ref_name }}" \
            -platform-specific

      - name: Build (non-Windows)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/${{ matrix.asset_name }} \
            ./cmd/launcher

      - name: Build (Windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-X main.version=${{ github.ref_name }}" \
            -o dist/${{ matrix.asset_name }} \
            ./cmd/launcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
