name: Release

on:
  push:
    tags:
      - "v*"
      - "mcp-token/v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Map the pushed tag to a single component + version. The launcher keeps
      # the bare vX.Y.Z namespace; mcp-token releases under mcp-token/vX.Y.Z so
      # the two binaries version on independent schedules (issue #25).
      - name: Resolve component from tag
        id: comp
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            mcp-token/v*)
              echo "name=mcp-token" >> "$GITHUB_OUTPUT"
              echo "dir=cmd/mcp-token" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#mcp-token/}" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "name=mcp-launcher" >> "$GITHUB_OUTPUT"
              echo "dir=cmd/launcher" >> "$GITHUB_OUTPUT"
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unrecognized tag $TAG"; exit 1 ;;
          esac

      # Windows Smart App Control blocks binaries that strip the symbol table
      # (-s) and lack version-info resources (see #20, #21-24). For Windows we
      # embed per-binary version info into the package dir and keep the symbols.
      - name: Generate Windows version info
        if: matrix.goos == 'windows'
        working-directory: ${{ steps.comp.outputs.dir }}
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          VER="${{ steps.comp.outputs.version }}"
          VER="${VER#v}"
          MAJ="${VER%%.*}"
          REST="${VER#*.}"
          MIN="${REST%%.*}"
          PATCH="${REST#*.}"
          echo "{}" > versioninfo.json
          goversioninfo \
            -product-name="${{ steps.comp.outputs.name }}" \
            -description="MCP credential tooling: ${{ steps.comp.outputs.name }}" \
            -company="masuda-masuo" \
            -copyright="MIT License" \
            -ver-major="$MAJ" \
            -ver-minor="$MIN" \
            -ver-patch="$PATCH" \
            -product-ver-major="$MAJ" \
            -product-ver-minor="$MIN" \
            -product-ver-patch="$PATCH" \
            -file-version="${{ steps.comp.outputs.version }}" \
            -product-version="${{ steps.comp.outputs.version }}" \
            -platform-specific

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="-X main.version=${{ steps.comp.outputs.version }}"
          else
            LDFLAGS="-s -w -X main.version=${{ steps.comp.outputs.version }}"
          fi
          mkdir -p dist
          go build -ldflags="$LDFLAGS" \
            -o "dist/${{ steps.comp.outputs.name }}-${{ matrix.suffix }}${{ matrix.ext }}" \
            "./${{ steps.comp.outputs.dir }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.comp.outputs.name }}-${{ matrix.suffix }}
          path: dist/${{ steps.comp.outputs.name }}-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The mint socket's host-side kit ships as a release asset so it can be
      # installed on a machine that has neither a Go toolchain nor a checkout
      # of this repo (the GCP VM in dev-infra is exactly that). The installer
      # copies the unit files from ../systemd relative to itself rather than
      # embedding them, so the tarball must preserve that layout.
      - name: Package mint-socket kit
        if: startsWith(github.ref_name, 'mcp-token/v')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#mcp-token/}"
          mkdir -p kit/scripts kit/systemd
          cp scripts/install-mint-socket.sh kit/scripts/
          cp systemd/mcp-token.socket systemd/mcp-token@.service \
             systemd/mcp-keyring.service kit/systemd/
          tar -C kit -czf "dist/mcp-token-mint-socket-$VERSION.tar.gz" scripts systemd

      # scripts/install-mint-socket.sh (issue mcp-launcher#25 follow-up:
      # on-demand mint socket) downloads the mcp-token release binary
      # anonymously and verifies it against this file before installing
      # it -- sha256 verification is mandatory there, so every release
      # from this point on must publish checksums.txt alongside its
      # binaries. Generated over dist/* as a whole, so the mint-socket kit
      # tarball above is covered by the same file.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
